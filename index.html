<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>plasma8</title>
    <style>
      :root {
        --fg: rgba(255, 255, 255, 0.92);
        --panel: rgba(12, 12, 16, 0.78);
        --accent: #ff6a3d;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        font: 13px/1.4 system-ui, sans-serif;
        color: var(--fg);
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* The reserved corner: about 100x100 px, never a tap area. */
      #corner {
        position: fixed;
        z-index: 1; /* above the ?debug knob panel, so the menu is never covered */
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        width: 100px;
        height: 100px;
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
      }
      #menu-button {
        margin: 12px;
        width: 40px;
        height: 40px;
        padding: 8px;
        box-sizing: border-box;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #fff;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #corner.awake #menu-button,
      #menu-button:focus-visible {
        opacity: 0.35;
      }
      #corner.awake #menu-button:hover,
      #corner.open #menu-button {
        opacity: 0.8;
      }
      #menu-button svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #menu {
        position: absolute;
        top: 58px;
        right: 12px;
        width: 220px;
        padding: 12px 14px;
        box-sizing: border-box;
        border-radius: 10px;
        background: var(--panel);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: none;
      }
      #corner.open #menu {
        display: block;
      }
      #menu label {
        display: block;
        margin: 4px 0 10px;
      }
      #menu .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #menu input[type='range'] {
        width: 100%;
        margin: 4px 0 0;
        accent-color: var(--accent);
      }
      #menu input[type='checkbox'] {
        accent-color: var(--accent);
        width: 18px;
        height: 18px;
      }

      #metronome {
        position: fixed;
        left: calc(env(safe-area-inset-left, 0px) + 18px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
        display: none;
        align-items: center;
        gap: 22px;
        pointer-events: none;
      }
      #metronome.on {
        display: flex;
      }
      #dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
        will-change: transform;
      }
      #dot.first {
        width: 26px;
        height: 26px;
        margin: -4px;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9), 0 0 0 4px rgba(0, 0, 0, 0.35);
      }
      /* The tapping widget, lower right: 4 dots while counting in, then the early/late strip, and the tempo under it. */
      #tap-widget {
        position: fixed;
        right: calc(env(safe-area-inset-right, 0px) + 18px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
        width: 180px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.8s ease;
        text-shadow: 0 0 3px rgba(0, 0, 0, 0.7);
      }
      #tap-widget.shown {
        opacity: 1;
        transition-duration: 0.12s;
      }
      #tap-dots,
      #tap-strip {
        height: 20px;
        box-sizing: border-box;
      }
      #tap-dots {
        display: none;
        align-items: center;
        gap: 14px;
      }
      #tap-widget.counting #tap-dots {
        display: flex;
      }
      #tap-dots i {
        width: 12px;
        height: 12px;
        box-sizing: border-box;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.55);
        background: transparent;
      }
      #tap-dots i.on {
        background: rgba(255, 255, 255, 0.92);
        border-color: rgba(255, 255, 255, 0.92);
      }
      #tap-strip {
        position: relative;
        width: 100%;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.35);
      }
      #tap-widget.counting #tap-strip {
        display: none;
      }
      #tap-strip::before {
        /* the beat mark */
        content: '';
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 2px;
        margin-left: -1px;
        background: var(--accent);
      }
      #tap-strip i {
        position: absolute;
        top: 3px;
        bottom: 3px;
        width: 3px;
        margin-left: -1.5px;
        border-radius: 1px;
        background: #fff;
      }
      #tap-strip i.old {
        background: rgba(255, 255, 255, 0.7);
      }
      #tap-number {
        font-size: 13px;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        transition: color 0.3s ease;
      }
      #tap-number.green {
        color: #5fe08a;
      }

      #debug {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        left: calc(env(safe-area-inset-left, 0px) + 12px);
        display: none;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        font: 12px/1.4 ui-monospace, monospace;
        pointer-events: none;
        white-space: pre;
      }
      #debug.on {
        display: block;
      }

      /* ?debug only: the running algorithm's random values, on the left under the overlay and above the metronome. */
      #knobs {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 116px);
        left: calc(env(safe-area-inset-left, 0px) + 12px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 70px);
        width: min(340px, calc(100vw - 24px));
        display: none;
        flex-direction: column;
        border-radius: 10px;
        background: var(--panel);
        font: 11px/1.3 ui-monospace, monospace;
        user-select: text;
        -webkit-user-select: text;
      }
      #knobs.on {
        display: flex;
      }
      #knobs.folded {
        bottom: auto;
        width: auto;
      }
      #knobs.folded .body {
        display: none;
      }
      #knobs button {
        font: inherit;
        color: var(--fg);
        background: rgba(255, 255, 255, 0.1);
        border: 0;
        border-radius: 5px;
        padding: 4px 7px;
        cursor: pointer;
      }
      #knobs .fold {
        align-self: flex-end;
        margin: 6px;
      }
      #knobs .body {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 0 10px 10px;
      }
      #knobs .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 6px 0;
      }
      #knobs textarea {
        font: inherit;
        color: var(--fg);
        background: rgba(0, 0, 0, 0.5);
        border: 0;
        margin-bottom: 6px;
      }
      #knobs .list {
        overflow-y: auto;
        min-height: 0;
        padding-right: 8px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
      }
      #knobs .knob {
        display: grid;
        grid-template-columns: 40px 1fr 52px;
        align-items: center;
        gap: 1px 6px;
        margin-bottom: 8px;
      }
      #knobs .switch {
        display: block;
        margin: 0 0 8px;
      }
      #knobs .knob.moving .name {
        color: #8fd0ff;
      }
      #knobs .knob.moving input[type='range'] {
        opacity: 0.55;
      }
      #knobs .group {
        margin: 6px 0 8px;
        padding-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }
      #knobs .group span {
        display: block;
        opacity: 0.6;
      }
      #knobs .name {
        grid-column: 1 / -1;
        font-weight: 600;
      }
      #knobs label {
        opacity: 0.7;
      }
      #knobs .track {
        position: relative;
        height: 18px;
      }
      #knobs .track i {
        position: absolute;
        top: 6px;
        height: 6px;
        pointer-events: none;
      }
      #knobs .band {
        min-width: 2px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.28);
      }
      #knobs .tick {
        width: 2px;
        margin-left: -1px;
        background: rgba(255, 255, 255, 0.5);
      }
      #knobs .track::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 8px;
        height: 2px;
        background: rgba(255, 255, 255, 0.15);
      }
      #knobs input[type='range'] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 18px;
        margin: 0;
        background: transparent;
        -webkit-appearance: none;
        appearance: none;
      }
      #knobs input[type='range']::-webkit-slider-runnable-track {
        height: 18px;
        background: transparent;
      }
      #knobs input[type='range']::-moz-range-track {
        height: 18px;
        background: transparent;
      }
      #knobs input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 8px;
        height: 18px;
        border-radius: 3px;
        background: var(--fg);
      }
      #knobs input[type='range']::-moz-range-thumb {
        width: 8px;
        height: 18px;
        border: 0;
        border-radius: 3px;
        background: var(--fg);
      }
      #knobs input[data-part='value']::-webkit-slider-thumb {
        background: var(--accent);
      }
      #knobs input[data-part='value']::-moz-range-thumb {
        background: var(--accent);
      }
      #knobs output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="corner">
      <button id="menu-button" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
      <div id="menu" role="group" aria-label="Settings">
        <label for="intensity">
          <span class="row"><span>Intensity</span><span id="intensity-value"></span></span>
          <input id="intensity" type="range" min="0" max="1" step="0.01" />
        </label>
        <label for="strobe">
          <span class="row"><span>Strobe</span><span id="strobe-value"></span></span>
          <input id="strobe" type="range" min="0" max="1" step="0.01" />
        </label>
        <label for="metronome-toggle" class="row">
          <span>Metronome</span>
          <input id="metronome-toggle" type="checkbox" />
        </label>
      </div>
    </div>

    <div id="metronome" aria-hidden="true">
      <div id="dot"></div>
    </div>

    <div id="tap-widget" aria-hidden="true">
      <div id="tap-dots"><i></i><i></i><i></i><i></i></div>
      <div id="tap-strip"></div>
      <div id="tap-number"></div>
    </div>

    <div id="debug"></div>
    <div id="knobs" role="group" aria-label="Random values"></div>
    <div id="fatal"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
