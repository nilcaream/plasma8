<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>plasma8</title>
    <style>
      :root {
        --fg: rgba(255, 255, 255, 0.92);
        --panel: rgba(12, 12, 16, 0.78);
        --accent: #ff6a3d;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        font: 13px/1.4 system-ui, sans-serif;
        color: var(--fg);
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /*
       * The band: the whole width at the top, the one place for every control and the only place where a tap is not a tempo tap.
       * One row of parts of the same height, the metronome left, the tapping widget at the centre, the wheel and the sliders right;
       * on a narrow screen (a phone held upright) a second row takes the wheel and the sliders. A press in it shows all the parts for 5 s.
       */
      :root {
        --gap: 8px;
        --part-h: 72px;
        --radius: 10px;
        --band-h: calc(env(safe-area-inset-top, 0px) + var(--gap) + var(--part-h) + var(--gap));
      }
      #bar {
        position: fixed;
        z-index: 1; /* above the ?debug knob panel, so a part is never covered */
        top: 0;
        left: 0;
        right: 0;
        height: var(--band-h);
        box-sizing: border-box;
        padding: calc(env(safe-area-inset-top, 0px) + var(--gap)) calc(env(safe-area-inset-right, 0px) + var(--gap)) var(--gap)
          calc(env(safe-area-inset-left, 0px) + var(--gap));
        display: grid;
        grid-template-columns: minmax(max-content, 1fr) auto minmax(max-content, 1fr);
        align-items: start;
        column-gap: var(--gap);
      }
      #controls {
        justify-self: end;
        display: flex;
        gap: var(--gap);
      }
      @media (max-width: 599px) {
        :root {
          --band-h: calc(env(safe-area-inset-top, 0px) + var(--gap) + 2 * (var(--part-h) + var(--gap)));
        }
        #bar {
          row-gap: var(--gap);
        }
        #controls {
          grid-column: 1 / -1;
          justify-self: stretch;
          justify-content: flex-end;
        }
        #menu {
          flex: 1;
          max-width: 300px;
        }
      }

      /* Every part of the panel: the same height, background, radius and text, and invisible and out of the way until the panel is up. */
      .part {
        height: var(--part-h);
        box-sizing: border-box;
        border-radius: var(--radius);
        background: var(--panel);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s ease;
      }
      #bar.shown .part,
      #tap-widget.shown,
      #metronome.shown {
        opacity: 1;
        transition-duration: 0.12s;
      }
      #bar.shown .part {
        pointer-events: auto;
      }

      #metronome {
        width: var(--part-h);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
        will-change: transform;
      }
      #dot.first {
        width: 26px;
        height: 26px;
        margin: -4px;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9), 0 0 0 4px rgba(0, 0, 0, 0.35);
      }

      /* The tapping widget: 4 dots while counting in, then the early/late strip, and the tempo under it. */
      #tap-widget {
        width: 200px;
        padding: 0 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }
      #tap-dots,
      #tap-strip {
        height: 20px;
        box-sizing: border-box;
      }
      #tap-dots {
        display: none;
        align-items: center;
        gap: 14px;
      }
      #tap-widget.counting #tap-dots {
        display: flex;
      }
      #tap-dots i {
        width: 12px;
        height: 12px;
        box-sizing: border-box;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.55);
        background: transparent;
      }
      #tap-dots i.on {
        background: rgba(255, 255, 255, 0.92);
        border-color: rgba(255, 255, 255, 0.92);
      }
      #tap-strip {
        position: relative;
        width: 100%;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
      }
      #tap-widget.counting #tap-strip {
        display: none;
      }
      #tap-strip::before {
        /* the beat mark */
        content: '';
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 2px;
        margin-left: -1px;
        background: var(--accent);
      }
      #tap-strip i {
        position: absolute;
        top: 3px;
        bottom: 3px;
        width: 3px;
        margin-left: -1.5px;
        border-radius: 1px;
        background: #fff;
      }
      #tap-strip i.old {
        background: rgba(255, 255, 255, 0.7);
      }
      #tap-number {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        transition: color 0.3s ease;
      }
      #tap-number.green {
        color: #5fe08a;
      }

      /* The whole-number tempo wheel, left of the sliders: three rows show, the middle one is the tempo. */
      #tempo-wheel {
        position: relative;
        width: 56px;
        overflow: hidden;
        cursor: ns-resize;
        outline: none;
        touch-action: none;
      }
      #tempo-wheel:focus-visible {
        box-shadow: 0 0 0 2px var(--accent);
      }
      #tempo-wheel-rows {
        position: absolute;
        inset: 0;
        -webkit-mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent);
        mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent);
      }
      #tempo-wheel::before {
        /* the row that is the tempo */
        content: '';
        position: absolute;
        left: 6px;
        right: 6px;
        top: calc(50% - 12px);
        height: 24px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.14);
      }
      #tempo-wheel-rows span {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(50% - 12px);
        height: 24px;
        line-height: 24px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }

      /* The intensity and strobe sliders. */
      #menu {
        width: 220px;
        padding: 0 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
      }
      #menu label {
        display: grid;
        grid-template-columns: 62px 1fr 34px;
        align-items: center;
        gap: 8px;
      }
      #menu output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #menu input[type='range'] {
        width: 100%;
        min-width: 0;
        height: 20px;
        margin: 0;
        accent-color: var(--accent);
      }

      #debug {
        position: fixed;
        top: calc(var(--band-h) + 4px);
        left: calc(env(safe-area-inset-left, 0px) + 12px);
        display: none;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        font: 12px/1.4 ui-monospace, monospace;
        pointer-events: none;
        white-space: pre;
      }
      #debug.on {
        display: block;
      }

      /* ?debug only: the running algorithm's random values, on the left under the overlay. */
      #knobs {
        position: fixed;
        top: calc(var(--band-h) + 110px);
        left: calc(env(safe-area-inset-left, 0px) + 12px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        width: min(340px, calc(100vw - 24px));
        display: none;
        flex-direction: column;
        border-radius: 10px;
        background: var(--panel);
        font: 11px/1.3 ui-monospace, monospace;
        user-select: text;
        -webkit-user-select: text;
      }
      #knobs.on {
        display: flex;
      }
      #knobs.folded {
        bottom: auto;
        width: auto;
      }
      #knobs.folded .body {
        display: none;
      }
      #knobs button {
        font: inherit;
        color: var(--fg);
        background: rgba(255, 255, 255, 0.1);
        border: 0;
        border-radius: 5px;
        padding: 4px 7px;
        cursor: pointer;
      }
      #knobs .fold {
        align-self: flex-end;
        margin: 6px;
      }
      #knobs .body {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 0 10px 10px;
      }
      #knobs .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 6px 0;
      }
      #knobs textarea {
        font: inherit;
        color: var(--fg);
        background: rgba(0, 0, 0, 0.5);
        border: 0;
        margin-bottom: 6px;
      }
      #knobs .list {
        overflow-y: auto;
        min-height: 0;
        padding-right: 8px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
      }
      #knobs .knob {
        display: grid;
        grid-template-columns: 40px 1fr 52px;
        align-items: center;
        gap: 1px 6px;
        margin-bottom: 8px;
      }
      #knobs .switch {
        display: block;
        margin: 0 0 8px;
      }
      #knobs .knob.moving .name {
        color: #8fd0ff;
      }
      #knobs .knob.moving input[type='range'] {
        opacity: 0.55;
      }
      #knobs .group {
        margin: 6px 0 8px;
        padding-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }
      #knobs .group span {
        display: block;
        opacity: 0.6;
      }
      #knobs .name {
        grid-column: 1 / -1;
        font-weight: 600;
      }
      #knobs label {
        opacity: 0.7;
      }
      #knobs .track {
        position: relative;
        height: 18px;
      }
      #knobs .track i {
        position: absolute;
        top: 6px;
        height: 6px;
        pointer-events: none;
      }
      #knobs .band {
        min-width: 2px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.28);
      }
      #knobs .tick {
        width: 2px;
        margin-left: -1px;
        background: rgba(255, 255, 255, 0.5);
      }
      #knobs .track::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 8px;
        height: 2px;
        background: rgba(255, 255, 255, 0.15);
      }
      #knobs input[type='range'] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 18px;
        margin: 0;
        background: transparent;
        -webkit-appearance: none;
        appearance: none;
      }
      #knobs input[type='range']::-webkit-slider-runnable-track {
        height: 18px;
        background: transparent;
      }
      #knobs input[type='range']::-moz-range-track {
        height: 18px;
        background: transparent;
      }
      #knobs input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 8px;
        height: 18px;
        border-radius: 3px;
        background: var(--fg);
      }
      #knobs input[type='range']::-moz-range-thumb {
        width: 8px;
        height: 18px;
        border: 0;
        border-radius: 3px;
        background: var(--fg);
      }
      #knobs input[data-part='value']::-webkit-slider-thumb {
        background: var(--accent);
      }
      #knobs input[data-part='value']::-moz-range-thumb {
        background: var(--accent);
      }
      #knobs output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      /* ?debug only: the outline of each area where a tap is not a tempo tap */
      .tap-outline {
        position: fixed;
        z-index: 5;
        box-sizing: border-box;
        border: 1px dashed #ff3df2;
        pointer-events: none;
      }
      .tap-outline::after {
        content: attr(data-label);
        position: absolute;
        left: 2px;
        top: 1px;
        font: 10px/1.2 ui-monospace, monospace;
        color: #ff3df2;
        white-space: nowrap;
        text-shadow: 0 0 2px #000;
      }

      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="bar">
      <div id="metronome" class="part" aria-hidden="true">
        <div id="dot"></div>
      </div>

      <div id="tap-widget" class="part" aria-hidden="true">
        <div id="tap-dots"><i></i><i></i><i></i><i></i></div>
        <div id="tap-strip"></div>
        <div id="tap-number"></div>
      </div>

      <div id="controls">
        <div id="tempo-wheel" class="part" role="slider" tabindex="0" aria-label="Tempo in BPM" aria-orientation="vertical" aria-valuemin="60" aria-valuemax="180">
          <div id="tempo-wheel-rows"><span></span><span></span><span></span><span></span><span></span></div>
        </div>

        <div id="menu" class="part" role="group" aria-label="Settings">
          <label for="intensity">
            <span>Intensity</span>
            <input id="intensity" type="range" min="0" max="1" step="0.01" />
            <output id="intensity-value"></output>
          </label>
          <label for="strobe">
            <span>Strobe</span>
            <input id="strobe" type="range" min="0" max="1" step="0.01" />
            <output id="strobe-value"></output>
          </label>
        </div>
      </div>
    </div>

    <div id="debug"></div>
    <div id="knobs" role="group" aria-label="Random values"></div>
    <div id="fatal"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
