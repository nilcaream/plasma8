<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>plasma8</title>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="bar">
      <div id="metronome" class="part" aria-hidden="true">
        <div id="dot"></div>
      </div>

      <div id="tap-widget" class="part" aria-hidden="true">
        <div id="tap-dots"><i></i><i></i><i></i><i></i></div>
        <div id="tap-strip"></div>
        <div id="tap-number"></div>
      </div>

      <div id="controls">
        <div id="tempo-wheel" class="part" role="slider" tabindex="0" aria-label="Tempo in BPM" aria-orientation="vertical" aria-valuemin="60" aria-valuemax="180">
          <div id="tempo-wheel-rows"><span></span><span></span><span></span><span></span><span></span></div>
        </div>

        <div id="menu" class="part" role="group" aria-label="Settings">
          <label for="intensity">
            <span>Intensity</span>
            <input id="intensity" type="range" min="0" max="1" step="0.01" />
            <output id="intensity-value"></output>
          </label>
          <label for="strobe">
            <span>Strobe</span>
            <input id="strobe" type="range" min="0" max="1" step="0.01" />
            <output id="strobe-value"></output>
          </label>
        </div>
      </div>
    </div>

    <div id="debug"></div>
    <div id="knobs" role="group" aria-label="Random values"></div>
    <div id="fatal"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
